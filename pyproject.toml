[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venthora"
version = "0.3.0"
description = "Evidence-gated autonomous treasury agent on Airwallex"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.28,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
]

[project.scripts]
venthora-sandbox = "venthora.cli:main"
venthora-intake = "venthora.intake.cli:main"

[project.optional-dependencies]
solver = ["ortools>=9.10,<10"]
ledger = ["tigerbeetle>=0.16"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
# vendored originals are kept byte-identical (see PROVENANCE.md)
extend-exclude = ["src/venthora/originals"]

[tool.ruff.lint]
# Broad `except Exception` is deliberate at authority boundaries: every failure fails closed.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["venthora", "conftest"]
