services:
  venthora:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPA_URL: http://opa:8181
      # sign-in is off in this compose file and the port is published on 127.0.0.1 only; requests reach the
      # container through Docker's bridge, so the "own machine only" rule is opened here on purpose
      VENTHORA_OPEN: "1"
    volumes:
      - venthora-data:/app/data   # a named volume: it starts from the image's data and belongs to the service's own user
    depends_on: [opa]

  opa:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/treasury.rego"]
    volumes:
      - ./policy:/policy:ro
    expose: ["8181"]

volumes:
  venthora-data:
