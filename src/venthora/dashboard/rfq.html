<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotation form</title>
<style>
:root{--ink:#14183a;--muted:#5b6280;--line:#dfe3ef;--bg:#f5f7fb;--card:#fff;--accent:#1a1f71;--good:#13795b;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}header b{font-size:18px}.tag{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}label.full{grid-column:1/-1}
input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:80px}.req::after{content:" *";color:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}
td.c{width:90px;text-align:center}.sum{font-size:16px;font-weight:700}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px}.ok{background:#e7f6ef;color:var(--good)}.err{background:#fdecea;color:var(--bad)}
.lock{display:inline-block;background:#eef0fb;border-radius:6px;padding:1px 8px;font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}td.c{width:60px}}
</style></head>
<body><main>
<header><b>Request for quotation</b><span class="tag" id="ref"></span></header>
<div id="root"><div class="card">loading…</div></div>
</main>
<script>
const token=location.pathname.split("/").filter(Boolean)[1];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);let D=null,FILE=null;
const V=[["name","Company name",1],["legal_name","Legal name (as registered)",0],["registration_no","Company registration number",0],["tax_id","Tax ID (TIN / VAT / NPWP)",0],
 ["contact_person","Contact person",1],["email","Email",1],["phone","Phone (for the bank-detail call-back)",1],["website","Website",0],
 ["street_address","Street address",0],["city","City",0],["country_code","Country (2-letter code)",0]];
const B=[["bank_name","Bank name"],["account_name","Account holder name"],["account_number","Account number"],["iban","IBAN (if any)"],["swift_code","SWIFT / BIC"],["bank_country_code","Bank country (2-letter code)"]];
async function load(){const r=await fetch(`/rfq/${token}/data`);if(!r.ok){$("#root").innerHTML='<div class="card err">This link is not valid.</div>';return}
 D=await r.json();const p=D.pr,q=D.quote||{},v=q.vendor||{name:D.vendor.name,email:D.vendor.email};
 $("#ref").textContent=`${p.pr_number} · deadline ${D.deadline||"-"}`;
 if(D.closed){$("#root").innerHTML=`<div class="card">${esc(p.pr_number)} is already awarded; quotations are closed. Thank you.</div>`;return}
 const specs=p.specs||[];
 $("#root").innerHTML=`
 <div class="card"><h2>What we need</h2><div><b>${esc(p.title)}</b></div>
  <div class="tag">Quantity ${esc(p.quantity??"-")} ${esc(p.unit||"")} · currency ${esc(p.currency)} · needed by ${esc(p.needed_by||"-")}</div>
  ${p.brand?`<div style="margin-top:6px"><span class="lock">🔒 Brand required: ${esc(p.brand)}</span></div>`:""}
  ${q.submitted_at?`<div class="msg ok">You sent a quotation on ${esc(q.submitted_at.slice(0,16).replace("T"," "))} (revision ${q.revision}). Sending again replaces it.</div>`:""}</div>
 <form id="f">
 <div class="card"><h2>1 · Your company</h2><div class="grid">${V.map(([k,l,r])=>`<label><span class="${r?"req":""}">${l}</span><input name="v_${k}" value="${esc(v[k]||"")}" ${r?"required":""}></label>`).join("")}</div></div>
 <div class="card"><h2>2 · Bank details (verified by a phone call-back before any payment)</h2><div class="grid">${B.map(([k,l])=>`<label><span>${l}</span><input name="v_${k}" value="${esc(v[k]||"")}"></label>`).join("")}</div></div>
 <div class="card"><h2>3 · Specification checklist</h2>
  <div class="grid" style="margin-bottom:10px"><label><span class="req">Brand offered</span><input name="brand" required value="${esc(q.brand||p.brand||"")}"></label><label><span>Model / type</span><input name="model" value="${esc(q.model||"")}"></label></div>
  ${specs.length?`<table><tr><th>Specification</th><th class="c">Complies</th><th>Remark (what you offer)</th></tr>${specs.map((s,i)=>{const g=(q.specs||[])[i]||{};return`<tr><td>${esc(s)}</td><td class="c"><input type="checkbox" name="ok_${i}" ${g.ok?"checked":""} style="width:auto"></td><td><input name="note_${i}" value="${esc(g.note||"")}" placeholder="e.g. exact value offered"></td></tr>`}).join("")}</table>`:'<div class="tag">No itemised specification: describe what you offer below.</div>'}</div>
 <div class="card"><h2>4 · Price (${esc(p.currency)})</h2><div class="grid">
  <label><span class="req">Quantity</span><input name="quantity" type="number" step="any" min="0" required value="${esc(q.quantity??p.quantity??"")}"></label>
  <label><span class="req">Unit price</span><input name="unit_price" type="number" step="0.01" min="0" required value="${q.unit_price_minor!=null?(q.unit_price_minor/100).toFixed(2):""}"></label>
  <label><span>Delivery cost</span><input name="delivery" type="number" step="0.01" min="0" value="${q.delivery_minor!=null?(q.delivery_minor/100).toFixed(2):"0"}"></label>
  <label><span>Tax</span><input name="tax" type="number" step="0.01" min="0" value="${q.tax_minor!=null?(q.tax_minor/100).toFixed(2):"0"}"></label>
  <label><span class="req">Delivery time (days)</span><input name="delivery_days" type="number" min="0" required value="${esc(q.delivery_days??"")}"></label>
  <label><span class="req">Quotation valid until</span><input name="valid_until" type="date" required value="${esc(q.valid_until||"")}"></label>
  <label class="full"><span>Payment terms</span><input name="payment_terms" value="${esc(q.payment_terms||"")}" placeholder="e.g. 30 days after delivery"></label>
  <label class="full"><span>Explanation</span><textarea name="explanation" placeholder="warranty, what is included, alternatives">${esc(q.explanation||"")}</textarea></label>
  <div class="full sum" id="total"></div></div></div>
 <div class="card"><h2>5 · Quotation document</h2><label><span>${q.file?`On file: ${esc(q.file.name)} — upload again to replace`:"Your signed quotation (PDF or image, up to 8 MB)"}</span><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xlsx,.txt"></label></div>
 <button id="send">Send quotation</button><div id="out"></div></form>`;
 const tot=()=>{const n=x=>parseFloat($(`[name=${x}]`).value||"0")||0;$("#total").textContent=`Total ${p.currency} ${(n("quantity")*n("unit_price")+n("delivery")+n("tax")).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`};
 ["quantity","unit_price","delivery","tax"].forEach(k=>$(`[name=${k}]`).oninput=tot);tot();
 $("#file").onchange=e=>{const f=e.target.files[0];if(!f){FILE=null;return}if(f.size>8*1024*1024){alert("The file is larger than 8 MB");e.target.value="";return}
  const rd=new FileReader();rd.onload=()=>FILE={name:f.name,data:rd.result};rd.readAsDataURL(f)};
 $("#f").onsubmit=async ev=>{ev.preventDefault();const fd=new FormData($("#f")),g=k=>fd.get(k);const vendor={};[...V,...B].forEach(([k])=>vendor[k]=g(`v_${k}`)||"");
  const body={vendor,brand:g("brand"),model:g("model"),specs:specs.map((_,i)=>({ok:!!g(`ok_${i}`),note:g(`note_${i}`)||""})),quantity:g("quantity"),unit_price:g("unit_price"),
   delivery:g("delivery"),tax:g("tax"),delivery_days:g("delivery_days"),valid_until:g("valid_until"),payment_terms:g("payment_terms"),explanation:g("explanation"),file:FILE};
  $("#send").disabled=true;$("#out").innerHTML="";
  try{const r=await fetch(`/rfq/${token}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json();
   if(!r.ok)throw new Error(j.detail||r.statusText);$("#out").innerHTML=`<div class="msg ok">Received: ${esc(j.pr_number)}, total ${esc(j.currency)} ${(j.total_minor/100).toLocaleString(undefined,{minimumFractionDigits:2})} (revision ${j.revision}). Thank you.</div>`}
  catch(e){$("#out").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}finally{$("#send").disabled=false}}}
load();
</script></body></html>
